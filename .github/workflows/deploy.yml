      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ⚠️ 新增这一步：强制升级 npm 到 11 版本，避开 edgesOut 崩溃
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci || npm install
