name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 🔽 核心改动 1：添加定时任务，每天检查一次子模块是否有更新
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间早上 8 点）自动跑一次

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 🔽 关键：递归拉取子模块，确保 src/blog 有内容
          submodules: recursive
          # 为了让子模块获取到最新的 commit，不能只拉取最近一次
          fetch-depth: 0
          # 🔽 如果子模块是私有仓库，需要传入 PAT
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Update Submodules
        # 确保拉取子模块的最新代码（防止 actions/checkout 缓存了旧的子模块）
        run: |
          git submodule update --remote --merge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build with Vite
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.vitepress/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
