name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天 UTC 0 点（北京时间早上 8 点）自动构建一次，检查子模块是否有新内容
  schedule:
    - cron: '0 0 * * *'

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务，新的 push 会取消进行中的旧任务
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 递归拉取子模块，确保 src/blog 有内容
          submodules: recursive
          # 拉取完整历史，便于子模块定位到正确的 commit
          fetch-depth: 0
          # 如果子模块是私有仓库，取消下面这行的注释并配置 PAT
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Update Submodules
        # 注意：这里用 update 而不是 update --remote
        # --remote 会把子模块强制同步到远端最新提交，可能把已删除的坏文件重新拉回来
        # 使用普通 update，让子模块停在工作流指定的 commit 上，行为更可控
        run: |
          git submodule update --init --recursive

      - name: Exclude template files from build
        # 兜底：即使子模块里还有含 Templater 语法的模板文件，
        # 也在构建前把它们移出 blog 扫描范围，避免 YAML 解析报错
        # -type d -name "模板" 匹配任意层级的模板目录
        run: |
          find src/blog -type d -name "模板" -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        # 优先用 npm ci 保证可复现；lock 文件不一致时回退到 npm install
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Clean VitePress cache
        # 清理旧缓存和产物，避免 createContentLoader 复用已删除文件的解析结果
        run: rm -rf .vitepress/cache .vitepress/dist

      - name: Build with Vite
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # VitePress 默认输出目录
          path: './.vitepress/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
