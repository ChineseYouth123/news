name: Deploy to GitHub Pages

on:
  # 当你推送到 main 分支时自动触发
  push:
    branches: [ main ]
  # 允许你在 Actions 页面手动点击运行
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务在运行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 关键：你之前用了子模块，这里必须拉取，否则打包时文档会丢失！
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 如果你是 pnpm/yarn，请改为对应的，并安装对应包管理器

      - name: Install dependencies
        # 如果你用 pnpm，改成 pnpm install；用 yarn，改成 yarn install
        run: npm ci || npm install

      - name: Build with Vite (or your framework)
        # 如果你在 package.json 里的打包命令不是 build，请修改这里
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ 关键：这是你打包后的产物目录，Vite 默认是 dist，VuePress 默认是 .vuepress/dist，请确保路径正确！
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
